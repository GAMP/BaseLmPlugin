<!DOCTYPE html>
<!-- saved from url=(0016)http://localhost -->
<head>
  <script type="text/javascript" data-callback="setupEnforcement" src="https://epic-games-api.arkoselabs.com/v2/37D033EB-6489-3763-2AE1-A228C04103F5/api.js" async defer></script>
</head>
<body>
  <form method="post" target="_self">
    <input type="submit" id="submit-id" onclick="return false;" disabled="disabled" style="visibility: hidden;">
  </form>
  <script>
  function setupEnforcement(myEnforcement) {
    myEnforcement.setConfig({
      selector: '#submit-id',
      onCompleted: function(response) {
		window.external.OnCaptchaCompleted(response.token)
      },
      onReady: function() {
		document.getElementById("submit-id").click();
      },
	   onHide: function() {
        window.external.OnWebWindowClosed()
      }	  
    });
  }

</script>
</body>
